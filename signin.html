<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | Welcome to Nigeria</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="auth-page">
    <header class="site-header">
      <nav class="navbar">
        <div class="container nav-content">
          <a href="index.html" class="logo"
            ><img
              src="Travelogo.png"
              class="logo-image"
              alt="Welcome to Nigeria Logo"
          /></a>
          <div class="auth-simple-nav">
            <a href="index.html">Home</a
            ><a href="signup.html">Create account</a>
          </div>
        </div>
      </nav>
    </header>
    <main class="auth-shell">
      <section class="auth-panel auth-panel-compact">
        <div class="auth-intro">
          <span class="eyebrow">YOUR JOURNEY</span>
          <h1>Sign in to <em>continue.</em></h1>
          <p>
            Access your account and continue planning your Nigeria experience.
          </p>
        </div>
        <form class="auth-form" id="signinForm" novalidate>
          <label class="auth-field"
            ><span>Email Address</span
            ><input
              name="email"
              type="email"
              autocomplete="email"
              required /></label
          ><label class="auth-field"
            ><span>Password</span>
            <div class="auth-input-action">
              <input
                id="signinPassword"
                name="password"
                type="password"
                autocomplete="current-password"
                required
              /><button
                type="button"
                data-toggle-password="signinPassword"
                aria-pressed="false"
              >
                Show
              </button>
            </div></label
          >
          <div class="auth-form-row">
            <label class="auth-check"
              ><input name="remember" type="checkbox" checked /><span
                >Remember me</span
              ></label
            ><a href="forgot-password.html" class="auth-muted-link"
              >Forgot password?</a
            >
          </div>
          <div
            id="signinMessage"
            class="auth-message"
            role="status"
            hidden
          ></div>
          <button class="btn btn-primary auth-submit" type="submit">
            Sign In
          </button>
          <p class="auth-switch">
            New to Welcome to Nigeria?
            <a href="signup.html">Create an account</a>
          </p>
          <p class="auth-demo-note">
            Sign in securely to manage your profile and travel plans.
          </p>
        </form>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
