<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | Welcome to Nigeria</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="auth-page">
    <header class="site-header">
      <nav class="navbar">
        <div class="container nav-content">
          <a href="index.html" class="logo"
            ><img
              src="Travelogo.png"
              class="logo-image"
              alt="Welcome to Nigeria Logo"
          /></a>
          <div class="auth-simple-nav">
            <a href="index.html">Home</a><a href="signin.html">Sign in</a>
          </div>
        </div>
      </nav>
    </header>
    <main class="auth-shell">
      <section class="auth-panel auth-panel-compact">
        <div class="auth-intro">
          <span class="eyebrow">ACCOUNT HELP</span>
          <h1>Reset your <em>password.</em></h1>
          <p>Enter your registered email to preview the recovery flow.</p>
        </div>
        <form class="auth-form" id="forgotForm" novalidate>
          <label class="auth-field"
            ><span>Email Address</span
            ><input name="email" type="email" autocomplete="email" required
          /></label>
          <div
            id="forgotMessage"
            class="auth-message"
            role="status"
            hidden
          ></div>
          <button class="btn btn-primary auth-submit" type="submit">
            Reset Password</button
          ><a
            id="resetLink"
            class="auth-secondary-button"
            href="reset-password.html"
            hidden
            >Continue to reset password</a
          >
          <p class="auth-switch"><a href="signin.html">Back to sign in</a></p>
          <p class="auth-demo-note">
            We will help you securely regain access to your account.
          </p>
        </form>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
