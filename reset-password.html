<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | Welcome to Nigeria</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="auth-page">
    <header class="site-header">
      <nav class="navbar">
        <div class="container nav-content">
          <a href="index.html" class="logo"
            ><img
              src="Travelogo.png"
              class="logo-image"
              alt="Welcome to Nigeria Logo"
          /></a>
          <div class="auth-simple-nav">
            <a href="index.html">Home</a><a href="signin.html">Sign in</a>
          </div>
        </div>
      </nav>
    </header>
    <main class="auth-shell">
      <section class="auth-panel auth-panel-compact">
        <div class="auth-intro">
          <span class="eyebrow">ACCOUNT SECURITY</span>
          <h1>Choose a new <em>password.</em></h1>
          <p>Choose a new password to keep your account protected.</p>
        </div>
        <form class="auth-form" id="resetForm" novalidate>
          <div class="auth-requirements">
            <strong>Password requirements</strong
            ><span
              >At least 8 characters, including one letter and one number.</span
            >
          </div>
          <label class="auth-field"
            ><span>New Password</span>
            <div class="auth-input-action">
              <input
                id="resetPassword"
                name="password"
                type="password"
                autocomplete="new-password"
                required
              /><button
                type="button"
                data-toggle-password="resetPassword"
                aria-pressed="false"
              >
                Show
              </button>
            </div></label
          >
          <div class="auth-strength">
            <div
              id="passwordStrengthMeter"
              class="password-strength"
              data-level="0"
            ></div>
            <span id="passwordStrengthLabel"></span>
          </div>
          <label class="auth-field"
            ><span>Confirm New Password</span>
            <div class="auth-input-action">
              <input
                id="resetConfirmPassword"
                name="confirmPassword"
                type="password"
                autocomplete="new-password"
                required
              /><button
                type="button"
                data-toggle-password="resetConfirmPassword"
                aria-pressed="false"
              >
                Show
              </button>
            </div></label
          >
          <div
            id="resetMessage"
            class="auth-message"
            role="status"
            hidden
          ></div>
          <button class="btn btn-primary auth-submit" type="submit">
            Update Password
          </button>
          <p class="auth-switch"><a href="signin.html">Back to sign in</a></p>
          <p class="auth-demo-note">Your password will be updated securely.</p>
        </form>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
